<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Grade Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #e2e8f0;
  }
  .card {
    background: #1e293b;
    width: 100%;
    max-width: 440px;
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  h1 { font-size: 24px; text-align: center; }
  .sub { text-align: center; color: #94a3b8; font-size: 14px; margin: 6px 0 24px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row input {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 12px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: border .15s;
  }
  .row input:focus { border-color: #3b82f6; }
  .row .subject { flex: 1; }
  .row .score { width: 80px; text-align: center; }
  .row .del {
    background: transparent; border: none; color: #64748b;
    font-size: 18px; cursor: pointer; padding: 0 6px;
  }
  .row .del:hover { color: #ef4444; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  button.btn {
    flex: 1; border: none; border-radius: 10px; padding: 12px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s;
  }
  button.btn:hover { opacity: .88; }
  .add { background: #334155; color: #fff; }
  .clear { background: #334155; color: #fff; }
  .calc { background: #2563eb; color: #fff; }
  .result {
    margin-top: 24px; background: #0f172a; border-radius: 14px;
    padding: 24px; text-align: center;
  }
  .grade { font-size: 60px; font-weight: 800; line-height: 1; }
  .detail { color: #94a3b8; margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Grade Calculator</h1>
    <p class="sub">Enter each subject and its score (0–100)</p>

    <div id="rows"></div>

    <div class="actions">
      <button class="btn add" onclick="addRow()">+ Add</button>
      <button class="btn clear" onclick="clearAll()">Clear</button>
      <button class="btn calc" onclick="calculate()">Calculate</button>
    </div>

    <div class="result">
      <div class="grade" id="grade">—</div>
      <div class="detail" id="detail">Add subjects and press Calculate</div>
    </div>
  </div>

<script>
  const rowsEl = document.getElementById('rows');
  const colors = { 'A+':'#22c55e', A:'#4ade80', B:'#84cc16', C:'#eab308', D:'#f97316', F:'#ef4444' };

  function addRow(subject = '', score = '') {
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `
      <input class="subject" placeholder="Subject" value="${subject}">
      <input class="score" placeholder="0-100" value="${score}" inputmode="numeric">
      <button class="del" onclick="this.parentElement.remove()">&times;</button>`;
    rowsEl.appendChild(div);
  }

  function clearAll() {
    rowsEl.innerHTML = '';
    for (let i = 0; i < 3; i++) addRow();
    setResult('—', '#fff', 'Add subjects and press Calculate');
  }

  function letter(avg) {
    if (avg >= 90) return 'A+';
    if (avg >= 80) return 'A';
    if (avg >= 70) return 'B';
    if (avg >= 55) return 'C';
    if (avg >= 35) return 'D';
    return 'F';
  }

  function setResult(grade, color, detail) {
    const g = document.getElementById('grade');
    g.textContent = grade;
    g.style.color = color;
    document.getElementById('detail').textContent = detail;
  }

  function calculate() {
    const scores = [];
    for (const row of rowsEl.querySelectorAll('.row')) {
      const raw = row.querySelector('.score').value.trim();
      if (!raw) continue;
      const val = Number(raw);
      if (Number.isNaN(val) || val < 0 || val > 100) {
        setResult('!', '#ef4444', `"${raw}" is not a valid score (0–100)`);
        return;
      }
      scores.push(val);
    }
    if (!scores.length) {
      setResult('—', '#fff', 'Enter at least one score');
      return;
    }
    const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
    const g = letter(avg);
    const status = avg >= 35 ? 'PASS' : 'FAIL';
    setResult(g, colors[g],
      `Average: ${avg.toFixed(1)}%  •  ${status}  •  ${scores.length} subject(s)`);
  }

  // start with 3 rows
  for (let i = 0; i < 3; i++) addRow();
</script>
</body>
</html>
